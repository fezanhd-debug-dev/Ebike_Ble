name: Android CI Workflow

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          cmdline-tools-version: '12266719'
          accept-android-sdk-licenses: true

      - name: Verify www folder exists
        run: |
          if [ ! -d "www" ]; then
            echo "ERROR: www/ folder not found. Move index.html, css/, js/ into www/"
            exit 1
          fi

      - name: Remove stale android folder (if committed)
        run: rm -rf android

      - name: Install Dependencies & Sync Capacitor
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build with Gradle
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EBike-Smart-App-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
